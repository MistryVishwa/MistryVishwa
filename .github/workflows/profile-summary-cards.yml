name: GitHub-Profile-Summary-Cards

on:
  schedule:
    # Regenerates the cards every 24 hours so stats stay fresh
    - cron: "0 0 * * *"
  workflow_dispatch: # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Must be a Personal Access Token stored as a repo secret
          # named SUMMARY_GITHUB_TOKEN (see setup steps below).
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: MistryVishwa
          BRANCH_NAME: "main"
          # Ahmedabad, India = UTC +5:30
          UTC_OFFSET: 5.5
          EXCLUDE: ""
          AUTO_PUSH: true
